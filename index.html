<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yapılacaklar Listesi</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --done: #9ca3af;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 24px 16px;
  }

  .container { max-width: 760px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 28px; color: var(--primary); }
  header p { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .hidden { display: none !important; }

  /* ---------- Auth ekranı ---------- */
  .auth-card {
    max-width: 380px; margin: 40px auto 0; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px;
  }
  .auth-card h2 { font-size: 20px; margin-bottom: 4px; }
  .auth-card .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .auth-card label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .auth-card input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 15px; outline: none; margin-bottom: 16px;
  }
  .auth-card input:focus { border-color: var(--primary); }
  .auth-card .primary-btn {
    width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none;
    border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .auth-card .primary-btn:hover { background: var(--primary-dark); }
  .auth-card .primary-btn:disabled { opacity: .6; cursor: not-allowed; }
  .auth-switch { text-align: center; margin-top: 16px; font-size: 14px; color: var(--muted); }
  .auth-switch a { color: var(--primary); font-weight: 600; cursor: pointer; text-decoration: none; }
  .auth-msg { font-size: 14px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
  .auth-msg.error { display: block; background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }

  /* ---------- Üst bilgi çubuğu ---------- */
  .userbar {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; margin-bottom: 16px; font-size: 14px;
  }
  .userbar .email { color: var(--muted); }
  .userbar button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .userbar button:hover { border-color: var(--danger); color: var(--danger); }

  /* ---------- Sekmeler ---------- */
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .tab {
    flex: 1; max-width: 160px; padding: 10px 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 600; transition: all .15s;
  }
  .tab:hover { border-color: var(--primary); }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ---------- Giriş alanı ---------- */
  .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .input-row input[type="text"] {
    flex: 1; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 15px; outline: none;
  }
  .input-row input[type="text"]:focus { border-color: var(--primary); }
  .input-row select, .input-row input[type="time"] {
    padding: 12px 10px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; outline: none; background: var(--card);
  }
  .input-row button {
    padding: 12px 18px; background: var(--primary); color: #fff; border: none;
    border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  .input-row button:hover { background: var(--primary-dark); }
  .input-row button:disabled { opacity: .6; cursor: not-allowed; }

  /* ---------- Liste ---------- */
  .list { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; min-height: 80px; }
  .group-title {
    padding: 10px 16px; background: #f9fafb; font-size: 13px; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: .5px; border-top: 1px solid var(--border);
  }
  .group-title:first-child { border-top: none; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .item input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
  .item .time { font-size: 13px; font-weight: 700; color: var(--primary); min-width: 48px; }
  .item .text { flex: 1; font-size: 15px; word-break: break-word; }
  .item.done .text { text-decoration: line-through; color: var(--done); }
  .item .del { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 6px; flex-shrink: 0; }
  .item .del:hover { color: var(--danger); background: #fef2f2; }
  .empty, .loading { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 15px; }

  .footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .footer-bar button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .footer-bar button:hover { border-color: var(--danger); color: var(--danger); }

  .error-banner {
    display: none; background: #fef2f2; color: var(--danger); border: 1px solid #fecaca;
    padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 14px;
  }

  @media (max-width: 520px) {
    .input-row { flex-wrap: wrap; }
    .input-row input[type="text"] { flex-basis: 100%; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Yapılacaklar Listesi</h1>
      <p>Günlük, haftalık ve saatlik görevlerini yönet</p>
    </header>

    <!-- ============ GİRİŞ / KAYIT EKRANI ============ -->
    <div id="authScreen" class="auth-card">
      <h2 id="authTitle">Giriş Yap</h2>
      <p class="sub" id="authSub">Görevlerine erişmek için giriş yap</p>

      <div class="auth-msg" id="authMsg"></div>

      <label for="email">E-posta</label>
      <input type="email" id="email" placeholder="ornek@eposta.com" autocomplete="email">

      <label for="password">Şifre</label>
      <input type="password" id="password" placeholder="En az 6 karakter" autocomplete="current-password">

      <button class="primary-btn" id="authBtn">Giriş Yap</button>

      <div class="auth-switch">
        <span id="switchText">Hesabın yok mu?</span>
        <a id="switchLink">Kaydol</a>
      </div>
    </div>

    <!-- ============ UYGULAMA ============ -->
    <div id="appScreen" class="hidden">
      <div class="userbar">
        <span class="email" id="userEmail"></span>
        <button id="logoutBtn">Çıkış yap</button>
      </div>

      <div class="error-banner" id="errorBanner"></div>

      <div class="tabs">
        <button class="tab active" data-view="daily">Günlük</button>
        <button class="tab" data-view="weekly">Haftalık</button>
        <button class="tab" data-view="hourly">Saatlik</button>
      </div>

      <div class="input-row">
        <input type="text" id="taskInput" placeholder="Yeni görev ekle..." autocomplete="off">
        <select id="daySelect" style="display:none;">
          <option value="Pazartesi">Pazartesi</option>
          <option value="Salı">Salı</option>
          <option value="Çarşamba">Çarşamba</option>
          <option value="Perşembe">Perşembe</option>
          <option value="Cuma">Cuma</option>
          <option value="Cumartesi">Cumartesi</option>
          <option value="Pazar">Pazar</option>
        </select>
        <input type="time" id="timeInput" style="display:none;" value="09:00">
        <button id="addBtn">Ekle</button>
      </div>

      <div class="list" id="list"></div>

      <div class="footer-bar">
        <span id="counter"></span>
        <button id="clearDone">Tamamlananları temizle</button>
      </div>
    </div>
  </div>

<script>
  /* ================= Supabase yapılandırması ================= */
  const SUPABASE_URL = "https://qhvezdujdbjspeejlzxl.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodmV6ZHVqZGJqc3BlZWpsenhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTA4MDksImV4cCI6MjA5NjE2NjgwOX0.-vhXhd1anb08-v9gncVjn9TgQmHJ4YsV1wp7GJRbbUs";
  const REST = SUPABASE_URL + "/rest/v1/todos";
  const AUTH = SUPABASE_URL + "/auth/v1";
  const SESSION_KEY = "todo_session_v1";

  /* ================= Oturum yönetimi ================= */
  let session = loadSession();

  // localStorage bazı ortamlarda (örn. data: URL önizleme) kapalı olabilir;
  // erişilemezse oturumu sayfa ömrü boyunca bellekte tutarız.
  const memStore = {};
  function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return (k in memStore) ? memStore[k] : null; } }
  function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } }
  function storeRemove(k) { try { localStorage.removeItem(k); } catch (e) { delete memStore[k]; } }

  function loadSession() {
    try { return JSON.parse(storeGet(SESSION_KEY)); } catch (e) { return null; }
  }
  function saveSession(s) {
    session = s;
    storeSet(SESSION_KEY, JSON.stringify(s));
  }
  function clearSession() {
    session = null;
    storeRemove(SESSION_KEY);
  }

  /* access_token süresi dolduysa refresh_token ile yeniler */
  async function refreshSession() {
    if (!session || !session.refresh_token) return false;
    const res = await fetch(AUTH + "/token?grant_type=refresh_token", {
      method: "POST",
      headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    if (!res.ok) return false;
    saveSession(await res.json());
    return true;
  }

  /* Oturumlu REST çağrısı; 401'de bir kez token yeniler */
  async function authFetch(path, options = {}, retry = true) {
    const headers = {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + (session ? session.access_token : SUPABASE_ANON_KEY),
      "Content-Type": "application/json",
      ...(options.headers || {})
    };
    const res = await fetch(REST + path, { ...options, headers });
    if (res.status === 401 && retry && session) {
      const ok = await refreshSession();
      if (ok) return authFetch(path, options, false);
      doLogout();
      throw new Error("Oturum süresi doldu, lütfen tekrar giriş yap.");
    }
    if (!res.ok) {
      const txt = await res.text();
      throw new Error("Sunucu hatası (" + res.status + "): " + txt);
    }
    if (res.status === 204) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  /* ================= Auth ekranı mantığı ================= */
  let mode = "login"; // veya "signup"

  const authScreen = document.getElementById("authScreen");
  const appScreen  = document.getElementById("appScreen");
  const authTitle  = document.getElementById("authTitle");
  const authSub    = document.getElementById("authSub");
  const authMsg    = document.getElementById("authMsg");
  const emailEl    = document.getElementById("email");
  const passEl     = document.getElementById("password");
  const authBtn    = document.getElementById("authBtn");
  const switchText = document.getElementById("switchText");
  const switchLink = document.getElementById("switchLink");
  const userEmailEl = document.getElementById("userEmail");

  function setMode(m) {
    mode = m;
    authMsg.className = "auth-msg";
    if (m === "login") {
      authTitle.textContent = "Giriş Yap";
      authSub.textContent = "Görevlerine erişmek için giriş yap";
      authBtn.textContent = "Giriş Yap";
      switchText.textContent = "Hesabın yok mu?";
      switchLink.textContent = "Kaydol";
      passEl.setAttribute("autocomplete", "current-password");
    } else {
      authTitle.textContent = "Kaydol";
      authSub.textContent = "Yeni hesap oluştur, onay gerekmez";
      authBtn.textContent = "Kaydol";
      switchText.textContent = "Zaten hesabın var mı?";
      switchLink.textContent = "Giriş yap";
      passEl.setAttribute("autocomplete", "new-password");
    }
  }
  switchLink.addEventListener("click", () => setMode(mode === "login" ? "signup" : "login"));

  function showAuthError(msg) {
    authMsg.textContent = msg;
    authMsg.className = "auth-msg error";
  }

  async function handleAuth() {
    const email = emailEl.value.trim();
    const password = passEl.value;
    if (!email || !password) { showAuthError("E-posta ve şifre gerekli."); return; }
    if (password.length < 6) { showAuthError("Şifre en az 6 karakter olmalı."); return; }

    authBtn.disabled = true;
    authMsg.className = "auth-msg";
    const endpoint = mode === "signup" ? "/signup" : "/token?grant_type=password";

    try {
      const res = await fetch(AUTH + endpoint, {
        method: "POST",
        headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const body = await res.json();

      if (!res.ok) {
        showAuthError(translateAuthError(body));
        return;
      }

      // Onay kapalı olduğu için kayıt da doğrudan oturum döndürür.
      if (body.access_token) {
        saveSession(body);
        enterApp();
      } else {
        // beklenmedik durum: oturum yoksa girişe yönlendir
        showAuthError("Hesap oluşturuldu. Lütfen giriş yapın.");
        setMode("login");
      }
    } catch (e) {
      showAuthError("Bağlantı hatası: " + e.message);
    } finally {
      authBtn.disabled = false;
    }
  }

  function translateAuthError(body) {
    const msg = (body && (body.msg || body.error_description || body.error || body.message)) || "Bilinmeyen hata";
    const m = msg.toLowerCase();
    if (m.includes("already registered") || m.includes("already been registered")) return "Bu e-posta zaten kayıtlı. Giriş yapmayı dene.";
    if (m.includes("invalid login")) return "E-posta veya şifre hatalı.";
    if (m.includes("password")) return "Şifre geçersiz (en az 6 karakter).";
    return msg;
  }

  authBtn.addEventListener("click", handleAuth);
  passEl.addEventListener("keydown", e => { if (e.key === "Enter") handleAuth(); });
  emailEl.addEventListener("keydown", e => { if (e.key === "Enter") passEl.focus(); });

  async function doLogout() {
    try {
      await fetch(AUTH + "/logout", {
        method: "POST",
        headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + (session ? session.access_token : "") }
      });
    } catch (e) { /* yoksay */ }
    clearSession();
    todos = [];
    appScreen.classList.add("hidden");
    authScreen.classList.remove("hidden");
    setMode("login");
    emailEl.value = ""; passEl.value = "";
  }
  document.getElementById("logoutBtn").addEventListener("click", doLogout);

  function enterApp() {
    authScreen.classList.add("hidden");
    appScreen.classList.remove("hidden");
    const email = session && session.user ? session.user.email : "";
    userEmailEl.textContent = email;
    currentView = "daily";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === "daily"));
    updateInputs();
    fetchTodos();
  }

  /* ================= Todo durumu ================= */
  const DAYS = ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
  let currentView = "daily";
  let todos = [];
  let loading = false;

  const taskInput  = document.getElementById("taskInput");
  const daySelect  = document.getElementById("daySelect");
  const timeInput  = document.getElementById("timeInput");
  const addBtn     = document.getElementById("addBtn");
  const listEl     = document.getElementById("list");
  const counterEl  = document.getElementById("counter");
  const clearBtn   = document.getElementById("clearDone");
  const errorEl    = document.getElementById("errorBanner");

  function showError(msg) { errorEl.textContent = msg; errorEl.style.display = "block"; }
  function clearError() { errorEl.style.display = "none"; }

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentView = tab.dataset.view;
      updateInputs();
      fetchTodos();
    });
  });

  function updateInputs() {
    daySelect.style.display = currentView === "weekly" ? "block" : "none";
    timeInput.style.display = currentView === "hourly" ? "block" : "none";
  }

  async function fetchTodos() {
    loading = true;
    listEl.innerHTML = '<div class="loading">Yükleniyor…</div>';
    try {
      const data = await authFetch("?select=*&view=eq." + currentView + "&order=created_at.asc");
      todos = data || [];
      clearError();
    } catch (e) {
      showError("Görevler yüklenemedi. " + e.message);
      todos = [];
    } finally {
      loading = false;
      render();
    }
  }

  async function addTask() {
    const text = taskInput.value.trim();
    if (!text) { taskInput.focus(); return; }
    const body = { text, view: currentView, done: false };
    if (currentView === "weekly") body.day = daySelect.value;
    if (currentView === "hourly") body.time = timeInput.value;

    addBtn.disabled = true;
    try {
      const created = await authFetch("", {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify(body)
      });
      if (created && created[0]) todos.push(created[0]);
      taskInput.value = "";
      clearError();
      render();
    } catch (e) {
      showError("Görev eklenemedi. " + e.message);
    } finally {
      addBtn.disabled = false;
      taskInput.focus();
    }
  }

  async function toggleDone(id, done) {
    try {
      await authFetch("?id=eq." + id, { method: "PATCH", body: JSON.stringify({ done }) });
      const t = todos.find(x => x.id === id);
      if (t) t.done = done;
      clearError();
      render();
    } catch (e) {
      showError("Güncellenemedi. " + e.message);
      render();
    }
  }

  async function deleteTask(id) {
    try {
      await authFetch("?id=eq." + id, { method: "DELETE" });
      todos = todos.filter(t => t.id !== id);
      clearError();
      render();
    } catch (e) {
      showError("Silinemedi. " + e.message);
    }
  }

  async function clearDone() {
    if (todos.filter(t => t.done).length === 0) return;
    try {
      await authFetch("?view=eq." + currentView + "&done=eq.true", { method: "DELETE" });
      todos = todos.filter(t => !t.done);
      clearError();
      render();
    } catch (e) {
      showError("Temizlenemedi. " + e.message);
    }
  }

  addBtn.addEventListener("click", addTask);
  taskInput.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
  clearBtn.addEventListener("click", clearDone);

  function makeItem(task, withTime) {
    const div = document.createElement("div");
    div.className = "item" + (task.done ? " done" : "");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = task.done;
    cb.addEventListener("change", () => toggleDone(task.id, cb.checked));
    div.appendChild(cb);
    if (withTime && task.time) {
      const t = document.createElement("span");
      t.className = "time";
      t.textContent = task.time ? task.time.slice(0, 5) : "";
      div.appendChild(t);
    }
    const span = document.createElement("span");
    span.className = "text";
    span.textContent = task.text;
    div.appendChild(span);
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.title = "Sil";
    del.addEventListener("click", () => deleteTask(task.id));
    div.appendChild(del);
    return div;
  }

  function render() {
    if (loading) return;
    listEl.innerHTML = "";
    if (todos.length === 0) {
      listEl.innerHTML = '<div class="empty">Henüz görev yok. Yukarıdan ekleyebilirsin 👆</div>';
      updateCounter();
      return;
    }
    if (currentView === "weekly") {
      DAYS.forEach(day => {
        const dayTasks = todos.filter(t => t.day === day);
        if (dayTasks.length === 0) return;
        const title = document.createElement("div");
        title.className = "group-title";
        title.textContent = day;
        listEl.appendChild(title);
        dayTasks.forEach(t => listEl.appendChild(makeItem(t, false)));
      });
    } else if (currentView === "hourly") {
      [...todos].sort((a, b) => (a.time || "").localeCompare(b.time || ""))
        .forEach(t => listEl.appendChild(makeItem(t, true)));
    } else {
      todos.forEach(t => listEl.appendChild(makeItem(t, false)));
    }
    updateCounter();
  }

  function updateCounter() {
    const done = todos.filter(t => t.done).length;
    counterEl.textContent = todos.length ? `${done} / ${todos.length} tamamlandı` : "";
  }

  /* ================= Başlat ================= */
  setMode("login");
  if (session && session.access_token) {
    enterApp();
  } else {
    authScreen.classList.remove("hidden");
  }
</script>
</body>
</html>
