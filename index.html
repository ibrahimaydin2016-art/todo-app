<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yapılacaklar Listesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #fff5ef;
    --muted: #f3d7c8;
    --accent: #ff8a5b;
    --accent2: #ff5f8d;
    --cyan: #ffcf8b;
    --glass: rgba(255,255,255,0.08);
    --glass-strong: rgba(255,255,255,0.12);
    --border: rgba(255,255,255,0.20);
    --done: rgba(255,245,239,0.45);
    --danger: #ff6b81;
    --grad: linear-gradient(135deg, #ff5f8d, #ff8a5b 55%, #ffc24b);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', system-ui, sans-serif;
    color: var(--text);
    line-height: 1.5;
    font-size: 15px;
    padding: 24px 16px 48px;
    position: relative;
    z-index: 0;
    min-height: 100vh;
    /* Gece gökyüzü arka plan resmi: yıldız tarlası + aurora ışıkları + derin gradyan */
    background-color: #2a1456;
    background-image:
      radial-gradient(1.4px 1.4px at 40px 50px, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 210px 30px, rgba(255,255,255,.65), transparent),
      radial-gradient(1.2px 1.2px at 320px 95px, rgba(255,255,255,.6), transparent),
      radial-gradient(circle 240px at 50% 72%, rgba(255,246,212,.95), rgba(255,170,95,.55) 38%, transparent 72%),
      linear-gradient(180deg, #241050 0%, #5b2a86 26%, #c0417e 52%, #ff7a59 76%, #ffc081 100%);
    background-repeat: repeat, repeat, repeat, no-repeat, no-repeat;
    background-size: 360px 260px, 360px 260px, 360px 260px, 100% 100%, 100% 100%;
    background-attachment: fixed;
  }

  /* Uzak ve yakın dağ silüetleri (arka plan resminin parçası) */
  body::before, body::after {
    content: ""; position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none;
  }
  body::before {
    height: 42vh; z-index: -2; opacity: .9;
    background: linear-gradient(180deg, #3a1d5e, #25103f);
    clip-path: polygon(0% 70%, 10% 55%, 22% 68%, 33% 42%, 45% 60%, 58% 38%, 70% 58%, 82% 40%, 92% 56%, 100% 46%, 100% 100%, 0% 100%);
  }
  body::after {
    height: 30vh; z-index: -1;
    background: linear-gradient(180deg, #1b0d2f, #0c0518);
    clip-path: polygon(0% 80%, 14% 60%, 26% 78%, 40% 52%, 52% 74%, 66% 50%, 78% 72%, 90% 56%, 100% 70%, 100% 100%, 0% 100%);
  }

  /* Yavaşça süzülen canlı aurora ışık şeritleri (dağların arkasında) */
  .aurora {
    position: fixed; inset: -25%; z-index: -3; pointer-events: none; opacity: .85;
    background:
      linear-gradient(115deg,
        rgba(255,95,141,0) 8%,
        rgba(255,95,141,.55) 24%,
        rgba(255,138,91,.5) 40%,
        rgba(255,194,75,.45) 54%,
        rgba(173,99,201,.5) 70%,
        rgba(94,140,255,0) 88%);
    background-size: 260% 260%;
    filter: blur(48px);
    animation: auroraDrift 24s ease-in-out infinite alternate;
    will-change: background-position, transform;
  }

  .container { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }

  header { text-align: center; margin-bottom: 28px; }
  header h1 {
    font-size: 30px; font-weight: 700; display: flex; align-items: center;
    justify-content: center; gap: 12px; line-height: 1.1;
  }
  header h1 .moon { font-size: 34px; filter: drop-shadow(0 4px 14px rgba(255,122,90,.6)); animation: floaty 4s ease-in-out infinite; }
  header h1 .grad {
    font-family: 'Dancing Script', cursive; font-weight: 700; font-size: 52px;
    background: linear-gradient(90deg, #ffc24b, #ff8a5b, #ff5f8d, #ff8a5b, #ffc24b);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 20px rgba(255,122,90,.45));
    animation: shimmer 9s linear infinite;
  }
  header p { color: var(--muted); font-size: 14px; margin-top: 6px; letter-spacing: .3px; }

  .hidden { display: none !important; }

  /* ---------- Cam efektli ortak yüzey ---------- */
  .auth-card, .userbar, .list {
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  }

  /* ---------- Auth ekranı ---------- */
  .auth-card {
    max-width: 400px; margin: 54px auto 0; border-radius: 24px; padding: 40px 28px 30px;
    position: relative; animation: rise .6s ease both;
  }
  .auth-card::before {
    content: "🌅"; position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
    font-size: 44px; filter: drop-shadow(0 6px 18px rgba(255,140,80,.7));
    animation: floaty 3.5s ease-in-out infinite;
  }
  .auth-card h2 {
    font-family: 'Dancing Script', cursive; font-weight: 700; font-size: 42px; text-align: center;
    background: var(--grad); -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent; margin-bottom: 2px;
  }
  .auth-card .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .auth-card label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; letter-spacing: .4px; }
  .auth-card input {
    width: 100%; padding: 13px 15px; border-radius: 12px; font-size: 15px; outline: none; margin-bottom: 16px;
    background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  .auth-card .primary-btn {
    width: 100%; padding: 14px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 16px; font-weight: 600; color: #fff; letter-spacing: .3px;
    background: var(--grad); background-size: 180% 180%;
    box-shadow: 0 10px 28px rgba(255,122,90,.45);
    transition: transform .15s, box-shadow .15s, filter .2s;
  }
  .auth-card .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(255,95,141,.5); filter: brightness(1.05); }
  .auth-card .primary-btn:active { transform: translateY(0); }
  .auth-card .primary-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .auth-switch { text-align: center; margin-top: 18px; font-size: 14px; color: var(--muted); }
  .auth-switch a { color: var(--accent2); font-weight: 600; cursor: pointer; text-decoration: none; }
  .auth-switch a:hover { text-decoration: underline; }
  .auth-msg { font-size: 14px; padding: 11px 13px; border-radius: 10px; margin-bottom: 16px; display: none; }
  .auth-msg.error { display: block; background: rgba(251,113,133,.14); color: #fecdd3; border: 1px solid rgba(251,113,133,.4); }

  /* ---------- Üst bilgi çubuğu ---------- */
  .userbar {
    display: flex; justify-content: space-between; align-items: center;
    border-radius: 14px; padding: 10px 16px; margin-bottom: 18px; font-size: 14px;
  }
  .userbar .email { color: var(--muted); }
  .userbar button {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted);
    padding: 7px 14px; border-radius: 9px; cursor: pointer; font-size: 13px; transition: all .15s;
  }
  .userbar button:hover { border-color: var(--danger); color: var(--danger); background: rgba(251,113,133,.1); }

  /* ---------- Sekmeler ---------- */
  .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 22px; }
  .tab {
    flex: 1; max-width: 170px; padding: 11px 12px; border-radius: 12px; cursor: pointer;
    font-size: 15px; font-weight: 600; transition: all .18s; color: var(--muted);
    background: var(--glass); border: 1px solid var(--border);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .tab:hover { color: var(--text); border-color: var(--accent); transform: translateY(-1px); }
  .tab.active {
    color: #fff; border-color: transparent; background: var(--grad);
    box-shadow: 0 10px 24px rgba(255,122,90,.4);
  }

  /* ---------- Giriş alanı ---------- */
  .input-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .input-row input[type="text"], .input-row select, .input-row input[type="time"] {
    padding: 13px 15px; border-radius: 12px; font-size: 15px; outline: none;
    background: var(--glass-strong); border: 1px solid var(--border); color: var(--text);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: border-color .15s, box-shadow .15s;
  }
  .input-row input[type="text"] { flex: 1; }
  .input-row select option { color: #15172e; }
  input:focus, select:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px rgba(255,138,91,.32); }
  ::placeholder { color: rgba(238,242,255,.42); }
  .input-row button {
    padding: 13px 22px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 15px; font-weight: 600; color: #fff; background: var(--grad);
    box-shadow: 0 10px 24px rgba(255,122,90,.4); transition: transform .15s, box-shadow .15s, filter .2s;
  }
  .input-row button:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(255,95,141,.5); filter: brightness(1.05); }
  .input-row button:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  /* ---------- Liste ---------- */
  .list { border-radius: 16px; overflow: hidden; min-height: 90px; }
  .group-title {
    padding: 11px 18px; background: rgba(255,255,255,0.04); font-size: 12px; font-weight: 700;
    color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; border-top: 1px solid var(--border);
  }
  .group-title:first-child { border-top: none; }
  .item { display: flex; align-items: center; gap: 13px; padding: 13px 18px; border-top: 1px solid rgba(255,255,255,0.09); transition: background .15s; }
  .item:hover { background: rgba(255,255,255,0.04); }
  .item input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent); flex-shrink: 0; }
  .item .time {
    font-size: 12px; font-weight: 700; min-width: 50px; padding: 3px 9px; border-radius: 999px;
    color: #3a1500; background: linear-gradient(135deg, #ffb056, #ffd06b); text-align: center;
  }
  .item .text { flex: 1; font-size: 15px; word-break: break-word; }
  .item.done .text { text-decoration: line-through; color: var(--done); }
  .item .del { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 9px; border-radius: 8px; flex-shrink: 0; transition: all .15s; }
  .item .del:hover { color: var(--danger); background: rgba(251,113,133,.12); }
  .empty, .loading { padding: 44px 16px; text-align: center; color: var(--muted); font-size: 15px; }

  .footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .footer-bar button {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted);
    padding: 7px 14px; border-radius: 9px; cursor: pointer; font-size: 13px; transition: all .15s;
  }
  .footer-bar button:hover { border-color: var(--danger); color: var(--danger); background: rgba(251,113,133,.1); }

  .error-banner {
    display: none; background: rgba(251,113,133,.14); color: #fecdd3; border: 1px solid rgba(251,113,133,.4);
    padding: 11px 15px; border-radius: 12px; margin-bottom: 14px; font-size: 14px;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes auroraDrift {
    0%   { background-position: 0% 30%;   transform: translateY(0) scale(1.05); }
    50%  { background-position: 100% 60%; transform: translateY(-3%) scale(1.1); }
    100% { background-position: 40% 100%; transform: translateY(0) scale(1.05); }
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  @media (prefers-reduced-motion: reduce) {
    .aurora, header h1 .grad, header h1 .moon, .auth-card::before { animation: none !important; }
  }
  .auth-card::before { animation: floaty 3.5s ease-in-out infinite; }

  @media (max-width: 520px) {
    .input-row { flex-wrap: wrap; }
    .input-row input[type="text"] { flex-basis: 100%; }
    header h1 .grad { font-size: 42px; }
  }
</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="container">
    <header>
      <h1><span class="moon">🌅</span><span class="grad">Yapılacaklar Listesi</span></h1>
      <p>Günlük, haftalık ve saatlik görevlerini yönet</p>
    </header>

    <!-- ============ GİRİŞ / KAYIT EKRANI ============ -->
    <div id="authScreen" class="auth-card">
      <h2 id="authTitle">Giriş Yap</h2>
      <p class="sub" id="authSub">Görevlerine erişmek için giriş yap</p>

      <div class="auth-msg" id="authMsg"></div>

      <label for="email">E-POSTA</label>
      <input type="email" id="email" placeholder="ornek@eposta.com" autocomplete="email">

      <label for="password">ŞİFRE</label>
      <input type="password" id="password" placeholder="En az 6 karakter" autocomplete="current-password">

      <button class="primary-btn" id="authBtn">Giriş Yap</button>

      <div class="auth-switch">
        <span id="switchText">Hesabın yok mu?</span>
        <a id="switchLink">Kaydol</a>
      </div>
    </div>

    <!-- ============ UYGULAMA ============ -->
    <div id="appScreen" class="hidden">
      <div class="userbar">
        <span class="email" id="userEmail"></span>
        <button id="logoutBtn">Çıkış yap</button>
      </div>

      <div class="error-banner" id="errorBanner"></div>

      <div class="tabs">
        <button class="tab active" data-view="daily">Günlük</button>
        <button class="tab" data-view="weekly">Haftalık</button>
        <button class="tab" data-view="hourly">Saatlik</button>
      </div>

      <div class="input-row">
        <input type="text" id="taskInput" placeholder="Yeni görev ekle..." autocomplete="off">
        <select id="daySelect" style="display:none;">
          <option value="Pazartesi">Pazartesi</option>
          <option value="Salı">Salı</option>
          <option value="Çarşamba">Çarşamba</option>
          <option value="Perşembe">Perşembe</option>
          <option value="Cuma">Cuma</option>
          <option value="Cumartesi">Cumartesi</option>
          <option value="Pazar">Pazar</option>
        </select>
        <input type="time" id="timeInput" style="display:none;" value="09:00">
        <button id="addBtn">Ekle</button>
      </div>

      <div class="list" id="list"></div>

      <div class="footer-bar">
        <span id="counter"></span>
        <button id="clearDone">Tamamlananları temizle</button>
      </div>
    </div>
  </div>

<script>
  /* ================= Supabase yapılandırması ================= */
  const SUPABASE_URL = "https://qhvezdujdbjspeejlzxl.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodmV6ZHVqZGJqc3BlZWpsenhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTA4MDksImV4cCI6MjA5NjE2NjgwOX0.-vhXhd1anb08-v9gncVjn9TgQmHJ4YsV1wp7GJRbbUs";
  const REST = SUPABASE_URL + "/rest/v1/todos";
  const AUTH = SUPABASE_URL + "/auth/v1";
  const SESSION_KEY = "todo_session_v1";

  /* ================= Oturum yönetimi ================= */
  let session = loadSession();

  // localStorage bazı ortamlarda (örn. data: URL önizleme) kapalı olabilir;
  // erişilemezse oturumu sayfa ömrü boyunca bellekte tutarız.
  const memStore = {};
  function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return (k in memStore) ? memStore[k] : null; } }
  function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } }
  function storeRemove(k) { try { localStorage.removeItem(k); } catch (e) { delete memStore[k]; } }

  function loadSession() {
    try { return JSON.parse(storeGet(SESSION_KEY)); } catch (e) { return null; }
  }
  function saveSession(s) {
    session = s;
    storeSet(SESSION_KEY, JSON.stringify(s));
  }
  function clearSession() {
    session = null;
    storeRemove(SESSION_KEY);
  }

  /* access_token süresi dolduysa refresh_token ile yeniler */
  async function refreshSession() {
    if (!session || !session.refresh_token) return false;
    const res = await fetch(AUTH + "/token?grant_type=refresh_token", {
      method: "POST",
      headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    if (!res.ok) return false;
    saveSession(await res.json());
    return true;
  }

  /* Oturumlu REST çağrısı; 401'de bir kez token yeniler */
  async function authFetch(path, options = {}, retry = true) {
    const headers = {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + (session ? session.access_token : SUPABASE_ANON_KEY),
      "Content-Type": "application/json",
      ...(options.headers || {})
    };
    const res = await fetch(REST + path, { ...options, headers });
    if (res.status === 401 && retry && session) {
      const ok = await refreshSession();
      if (ok) return authFetch(path, options, false);
      doLogout();
      throw new Error("Oturum süresi doldu, lütfen tekrar giriş yap.");
    }
    if (!res.ok) {
      const txt = await res.text();
      throw new Error("Sunucu hatası (" + res.status + "): " + txt);
    }
    if (res.status === 204) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  /* ================= Auth ekranı mantığı ================= */
  let mode = "login"; // veya "signup"

  const authScreen = document.getElementById("authScreen");
  const appScreen  = document.getElementById("appScreen");
  const authTitle  = document.getElementById("authTitle");
  const authSub    = document.getElementById("authSub");
  const authMsg    = document.getElementById("authMsg");
  const emailEl    = document.getElementById("email");
  const passEl     = document.getElementById("password");
  const authBtn    = document.getElementById("authBtn");
  const switchText = document.getElementById("switchText");
  const switchLink = document.getElementById("switchLink");
  const userEmailEl = document.getElementById("userEmail");

  function setMode(m) {
    mode = m;
    authMsg.className = "auth-msg";
    if (m === "login") {
      authTitle.textContent = "Giriş Yap";
      authSub.textContent = "Görevlerine erişmek için giriş yap";
      authBtn.textContent = "Giriş Yap";
      switchText.textContent = "Hesabın yok mu?";
      switchLink.textContent = "Kaydol";
      passEl.setAttribute("autocomplete", "current-password");
    } else {
      authTitle.textContent = "Kaydol";
      authSub.textContent = "Yeni hesap oluştur, onay gerekmez";
      authBtn.textContent = "Kaydol";
      switchText.textContent = "Zaten hesabın var mı?";
      switchLink.textContent = "Giriş yap";
      passEl.setAttribute("autocomplete", "new-password");
    }
  }
  switchLink.addEventListener("click", () => setMode(mode === "login" ? "signup" : "login"));

  function showAuthError(msg) {
    authMsg.textContent = msg;
    authMsg.className = "auth-msg error";
  }

  async function handleAuth() {
    const email = emailEl.value.trim();
    const password = passEl.value;
    if (!email || !password) { showAuthError("E-posta ve şifre gerekli."); return; }
    if (password.length < 6) { showAuthError("Şifre en az 6 karakter olmalı."); return; }

    authBtn.disabled = true;
    authMsg.className = "auth-msg";
    const endpoint = mode === "signup" ? "/signup" : "/token?grant_type=password";

    try {
      const res = await fetch(AUTH + endpoint, {
        method: "POST",
        headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const body = await res.json();

      if (!res.ok) {
        showAuthError(translateAuthError(body));
        return;
      }

      // Onay kapalı olduğu için kayıt da doğrudan oturum döndürür.
      if (body.access_token) {
        saveSession(body);
        enterApp();
      } else {
        // beklenmedik durum: oturum yoksa girişe yönlendir
        showAuthError("Hesap oluşturuldu. Lütfen giriş yapın.");
        setMode("login");
      }
    } catch (e) {
      showAuthError("Bağlantı hatası: " + e.message);
    } finally {
      authBtn.disabled = false;
    }
  }

  function translateAuthError(body) {
    const msg = (body && (body.msg || body.error_description || body.error || body.message)) || "Bilinmeyen hata";
    const m = msg.toLowerCase();
    if (m.includes("already registered") || m.includes("already been registered")) return "Bu e-posta zaten kayıtlı. Giriş yapmayı dene.";
    if (m.includes("invalid login")) return "E-posta veya şifre hatalı.";
    if (m.includes("password")) return "Şifre geçersiz (en az 6 karakter).";
    return msg;
  }

  authBtn.addEventListener("click", handleAuth);
  passEl.addEventListener("keydown", e => { if (e.key === "Enter") handleAuth(); });
  emailEl.addEventListener("keydown", e => { if (e.key === "Enter") passEl.focus(); });

  async function doLogout() {
    try {
      await fetch(AUTH + "/logout", {
        method: "POST",
        headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + (session ? session.access_token : "") }
      });
    } catch (e) { /* yoksay */ }
    clearSession();
    todos = [];
    appScreen.classList.add("hidden");
    authScreen.classList.remove("hidden");
    setMode("login");
    emailEl.value = ""; passEl.value = "";
  }
  document.getElementById("logoutBtn").addEventListener("click", doLogout);

  function enterApp() {
    authScreen.classList.add("hidden");
    appScreen.classList.remove("hidden");
    const email = session && session.user ? session.user.email : "";
    userEmailEl.textContent = email;
    currentView = "daily";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === "daily"));
    updateInputs();
    fetchTodos();
  }

  /* ================= Todo durumu ================= */
  const DAYS = ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
  let currentView = "daily";
  let todos = [];
  let loading = false;

  const taskInput  = document.getElementById("taskInput");
  const daySelect  = document.getElementById("daySelect");
  const timeInput  = document.getElementById("timeInput");
  const addBtn     = document.getElementById("addBtn");
  const listEl     = document.getElementById("list");
  const counterEl  = document.getElementById("counter");
  const clearBtn   = document.getElementById("clearDone");
  const errorEl    = document.getElementById("errorBanner");

  function showError(msg) { errorEl.textContent = msg; errorEl.style.display = "block"; }
  function clearError() { errorEl.style.display = "none"; }

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentView = tab.dataset.view;
      updateInputs();
      fetchTodos();
    });
  });

  function updateInputs() {
    daySelect.style.display = currentView === "weekly" ? "block" : "none";
    timeInput.style.display = currentView === "hourly" ? "block" : "none";
  }

  async function fetchTodos() {
    loading = true;
    listEl.innerHTML = '<div class="loading">Yükleniyor…</div>';
    try {
      const data = await authFetch("?select=*&view=eq." + currentView + "&order=created_at.asc");
      todos = data || [];
      clearError();
    } catch (e) {
      showError("Görevler yüklenemedi. " + e.message);
      todos = [];
    } finally {
      loading = false;
      render();
    }
  }

  async function addTask() {
    const text = taskInput.value.trim();
    if (!text) { taskInput.focus(); return; }
    const body = { text, view: currentView, done: false };
    if (currentView === "weekly") body.day = daySelect.value;
    if (currentView === "hourly") body.time = timeInput.value;

    addBtn.disabled = true;
    try {
      const created = await authFetch("", {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify(body)
      });
      if (created && created[0]) todos.push(created[0]);
      taskInput.value = "";
      clearError();
      render();
    } catch (e) {
      showError("Görev eklenemedi. " + e.message);
    } finally {
      addBtn.disabled = false;
      taskInput.focus();
    }
  }

  async function toggleDone(id, done) {
    try {
      await authFetch("?id=eq." + id, { method: "PATCH", body: JSON.stringify({ done }) });
      const t = todos.find(x => x.id === id);
      if (t) t.done = done;
      clearError();
      render();
    } catch (e) {
      showError("Güncellenemedi. " + e.message);
      render();
    }
  }

  async function deleteTask(id) {
    try {
      await authFetch("?id=eq." + id, { method: "DELETE" });
      todos = todos.filter(t => t.id !== id);
      clearError();
      render();
    } catch (e) {
      showError("Silinemedi. " + e.message);
    }
  }

  async function clearDone() {
    if (todos.filter(t => t.done).length === 0) return;
    try {
      await authFetch("?view=eq." + currentView + "&done=eq.true", { method: "DELETE" });
      todos = todos.filter(t => !t.done);
      clearError();
      render();
    } catch (e) {
      showError("Temizlenemedi. " + e.message);
    }
  }

  addBtn.addEventListener("click", addTask);
  taskInput.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
  clearBtn.addEventListener("click", clearDone);

  function makeItem(task, withTime) {
    const div = document.createElement("div");
    div.className = "item" + (task.done ? " done" : "");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = task.done;
    cb.addEventListener("change", () => toggleDone(task.id, cb.checked));
    div.appendChild(cb);
    if (withTime && task.time) {
      const t = document.createElement("span");
      t.className = "time";
      t.textContent = task.time ? task.time.slice(0, 5) : "";
      div.appendChild(t);
    }
    const span = document.createElement("span");
    span.className = "text";
    span.textContent = task.text;
    div.appendChild(span);
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.title = "Sil";
    del.addEventListener("click", () => deleteTask(task.id));
    div.appendChild(del);
    return div;
  }

  function render() {
    if (loading) return;
    listEl.innerHTML = "";
    if (todos.length === 0) {
      listEl.innerHTML = '<div class="empty">Henüz görev yok. Yukarıdan ekleyebilirsin 👆</div>';
      updateCounter();
      return;
    }
    if (currentView === "weekly") {
      DAYS.forEach(day => {
        const dayTasks = todos.filter(t => t.day === day);
        if (dayTasks.length === 0) return;
        const title = document.createElement("div");
        title.className = "group-title";
        title.textContent = day;
        listEl.appendChild(title);
        dayTasks.forEach(t => listEl.appendChild(makeItem(t, false)));
      });
    } else if (currentView === "hourly") {
      [...todos].sort((a, b) => (a.time || "").localeCompare(b.time || ""))
        .forEach(t => listEl.appendChild(makeItem(t, true)));
    } else {
      todos.forEach(t => listEl.appendChild(makeItem(t, false)));
    }
    updateCounter();
  }

  function updateCounter() {
    const done = todos.filter(t => t.done).length;
    counterEl.textContent = todos.length ? `${done} / ${todos.length} tamamlandı` : "";
  }

  /* ================= Başlat ================= */
  setMode("login");
  if (session && session.access_token) {
    enterApp();
  } else {
    authScreen.classList.remove("hidden");
  }
</script>
</body>
</html>
